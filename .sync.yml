---
.gitlab-ci.yml:
  delete: true

appveyor.yml:
  delete: true

Rakefile:
  changelog_user: puppetlabs
  changelog_since_tag: '4.0.0'
  extras:
    - |
      require 'rspec/core/rake_task'
      namespace :kubernetes do
        RSpec::Core::RakeTask.new(:integration) do |t|
          t.pattern = 'spec/acceptance/**{,/*/**}/*_spec.rb'
          t.rspec_opts = "--tag integration"
        end
      end
  extra_disabled_lint_checks:
    - params_empty_string_assignment
    # MODULES-11735: new in voxpupuli-puppet-lint-plugins 7.0 (needed for Puppet 9 support);
    # see the matching comment in Rakefile.
    - params_not_optional_with_undef
    - anchor_resource
  profiles:
    strict:
      configs:
        AllCops:
          TargetRubyVersion: '2.5'
          Exclude:
          - tooling/kube_tool/*
          - tooling/*
          - spec/*
          - rakelib/*
          - plans/*.pp
          - tasks/*
spec/default_facts.yml:
  extra_facts:
    networking:
      hostname: "kubernetes.localhost"
spec/spec_helper.rb:
  mock_with: ':rspec'
  coverage_report: true
  hiera_config_ruby: File.expand_path(File.join(File.dirname(__FILE__), 'fixtures/hiera/hiera.yaml'))
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
# ci.yml and nightly.yml were already unmanaged for the hand-written Integration job
# (bolt-based cluster provisioning; not expressible via pdk-templates). MODULES-11735
# adds a second reason: the Spec `with: ruby_version` input and the Integration job's
# Ruby 3.2 bump, both needed because voxpupuli-puppet-lint-plugins 7.0 (Puppet 9 support)
# requires ruby >= 3.2 and the templates emit no `ruby_version` key. Leaving them managed
# would let a scheduled `pdk update` PR silently revert this.
.github/workflows/ci.yml:
  unmanaged: true
.github/workflows/nightly.yml:
  unmanaged: true
  cron: '50 4 * * *'
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
.rubocop.yml:
  include_todos: true
# MODULES-11735: pin puppet_litmus above pdk-templates' own default (~> 2.5):
# puppet_litmus below 2.8.0 lacks the Puppet 9 collection support
# matrix_from_metadata_v3 needs to generate this module's Puppet 9 Spec lane.
# (puppetlabs_spec_helper is no longer overridden: pdk-templates main pins it per
# gem source, ~> 9.0 on puppetcore and ~> 8.0 on public gems. MODULES-12013)
Gemfile:
  overrides:
    - gem: 'puppet_litmus'
      version: '~> 2.8'
  # gems the module added by hand (MODULES-11997 pdk update)
  optional:
    ":development":
    # 1.1.0 keeps tooling/ in the built module for acceptance (CAT-2095); it needs
    # minitar ~> 0.9, which can't resolve with Puppet 9 on Ruby 4, so Ruby 4 takes
    # the version puppet_litmus pulls in (specs don't build the module)
    - gem: puppet-modulebuilder
      version: 1.1.0
      condition: "Gem.ruby_version < Gem::Version.new('4.0')"
