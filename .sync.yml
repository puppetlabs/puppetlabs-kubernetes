---
.gitlab-ci.yml:
  delete: true

appveyor.yml:
  delete: true

Rakefile:
  changelog_user: puppetlabs
  changelog_since_tag: '4.0.0'
  extras:
    - |
      require 'rspec/core/rake_task'
      namespace :kubernetes do
        RSpec::Core::RakeTask.new(:integration) do |t|
          t.pattern = 'spec/acceptance/**{,/*/**}/*_spec.rb'
          t.rspec_opts = "--tag integration"
        end
      end
  extra_disabled_lint_checks:
    - params_empty_string_assignment
    # MODULES-11735: new in voxpupuli-puppet-lint-plugins 7.0 (needed for Puppet 9 support);
    # see the matching comment in Rakefile.
    - params_not_optional_with_undef
  profiles:
    strict:
      configs:
        AllCops:
          TargetRubyVersion: '2.5'
          Exclude:
          - tooling/kube_tool/*
          - tooling/*
          - spec/*
          - rakelib/*
          - plans/*.pp
          - tasks/*
spec/default_facts.yml:
  extra_facts:
    networking:
      hostname: "kubernetes.localhost"
spec/spec_helper.rb:
  mock_with: ':rspec'
  coverage_report: true
  hiera_config_ruby: File.expand_path(File.join(File.dirname(__FILE__), 'fixtures/hiera/hiera.yaml'))
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
# ci.yml and nightly.yml were already unmanaged for the hand-written Integration job
# (bolt-based cluster provisioning; not expressible via pdk-templates). MODULES-11735
# adds a second reason: the Spec `with: ruby_version` input and the Integration job's
# Ruby 3.2 bump, both needed because voxpupuli-puppet-lint-plugins 7.0 (Puppet 9 support)
# requires ruby >= 3.2 and the templates emit no `ruby_version` key. Leaving them managed
# would let a scheduled `pdk update` PR silently revert this.
.github/workflows/ci.yml:
  unmanaged: true
.github/workflows/nightly.yml:
  unmanaged: true
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
.rubocop.yml:
  include_todos: true
